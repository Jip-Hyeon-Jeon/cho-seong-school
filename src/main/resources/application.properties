spring.application.name=cho-seong-school

spring.config.import=optional:file:./application-secret.properties

spring.datasource.hikari.jdbc-url=jdbc:mariadb://localhost/jiphyeonjeon
spring.datasource.hikari.username=${DB_USERNAME}
spring.datasource.hikari.password=${DB_PASSWORD}
spring.datasource.hikari.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.show-sql=true 

# 대기실 TCP 서버 (Spring 앱과 함께 실행)
# 0.0.0.0: 같은 Wi-Fi의 다른 PC도 접속 가능 / 127.0.0.1: 이 PC에서만 접속
lobby.bind-address=0.0.0.0
lobby.port=50024

# HikariCP 설정 (선택)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
