plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jiphyeonjeon'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	//Spring web
	implementation 'org.springframework.boot:spring-boot-starter-webmvc' 
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 실제 MariaDB 설정 없이 실행하는 Spring 컨텍스트 검사 전용 DB
	testRuntimeOnly 'com.h2database:h2'
	
	//Spring Data JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	
	//MariaDB
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'java.awt.headless', 'true'
}

tasks.register('runLobbyServer', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.jiphyeonjeon.choseongschool.lobby.server.LobbyServer'
	standardInput = System.in
}

// Spring(DB) + 대기실 TCP 서버를 한 번에 실행
tasks.register('runServer', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.jiphyeonjeon.choseongschool.ChoSeongSchoolApplication'
	workingDir = projectDir // application-secret.properties를 프로젝트 루트에서 읽음
}

tasks.register('runClient', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.jiphyeonjeon.choseongschool.client.ClientMain'
}
